<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>दिव्य पंचायत | जल्द आ रहा है</title>
<meta name="description" content="दिव्य पंचायत - जल्द ही शुरू हो रहा है। divyapanchayat.com">
<meta name="theme-color" content="#ff7a00">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#ff7a00;
    --amber:#ffb300;
    --yellow:#ffe14d;
    --ink:#333333;
    --bg1:#fff8ee;
    --bg2:#ffe3bf;
    --card:rgba(255,255,255,.72);
    --text:#333333;
    --muted:#6b5b4a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg1:#1a0f05;
      --bg2:#341a06;
      --card:rgba(30,16,6,.6);
      --text:#fff3e2;
      --muted:#e3c9a8;
      --ink:#fff3e2;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Mukta","Poppins","Noto Sans Devanagari",system-ui,sans-serif;
    color:var(--text);
    background:radial-gradient(ellipse at 50% 20%, var(--bg2), var(--bg1) 70%);
    overflow-x:hidden;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
  .wrap{
    position:relative;z-index:1;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding:24px 16px 32px;text-align:center;
    perspective:1000px;
  }
  .card{
    width:min(720px,100%);
    background:var(--card);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:2px solid rgba(255,122,0,.55);
    border-radius:28px;
    padding:28px 22px 24px;
    box-shadow:0 30px 60px -20px rgba(255,122,0,.45), 0 0 0 6px rgba(255,122,0,.08);
    transform-style:preserve-3d;
    transition:transform .15s ease-out;
    will-change:transform;
  }
  .badge{
    display:inline-block;transform:translateZ(30px);
    font-family:Poppins,sans-serif;font-weight:600;font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;
    color:#fff;background:linear-gradient(90deg,var(--orange),var(--amber));
    padding:7px 16px;border-radius:999px;margin-bottom:14px;
  }
  h1{
    font-weight:800;line-height:1.05;
    font-size:clamp(2.6rem,10vw,5.2rem);
    color:var(--ink);
    transform:translateZ(60px);
    text-shadow:0 2px 0 rgba(255,122,0,.25),0 10px 30px rgba(255,122,0,.35);
  }
  .bar{
    height:6px;width:min(420px,80%);margin:12px auto 14px;border-radius:6px;
    background:linear-gradient(90deg,var(--orange),var(--amber));
    transform:translateZ(40px);
  }
  .sub{
    font-size:clamp(1.05rem,3.4vw,1.4rem);font-weight:600;color:var(--muted);
    transform:translateZ(35px);
  }
  .sub b{color:var(--orange)}
  .count{
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px auto 6px;max-width:520px;
    transform:translateZ(45px);
  }
  .box{
    background:linear-gradient(160deg,rgba(255,122,0,.16),rgba(255,179,0,.10));
    border:1.5px solid rgba(255,122,0,.45);
    border-radius:16px;padding:12px 4px;
  }
  .box span{display:block;font-family:Poppins,sans-serif;font-weight:600;font-size:clamp(1.5rem,6vw,2.4rem);color:var(--orange);font-variant-numeric:tabular-nums}
  .box small{display:block;font-size:.85rem;color:var(--muted);font-weight:600;margin-top:2px}
  .social{
    display:flex;justify-content:center;gap:14px;margin-top:20px;flex-wrap:wrap;
    transform:translateZ(40px);
  }
  .social a{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
    background:#111;color:#fff;transition:transform .2s, box-shadow .2s;
    box-shadow:0 6px 14px rgba(0,0,0,.25);
  }
  .social a:hover,.social a:focus-visible{transform:translateY(-6px) scale(1.08);box-shadow:0 14px 24px rgba(255,122,0,.5);outline:none}
  .social a.yt{background:#f00}
  .social a svg{width:22px;height:22px;fill:currentColor}
  .handle{margin-top:14px;font-family:Poppins,sans-serif;font-size:1.05rem;color:var(--muted);transform:translateZ(25px)}
  .handle b{color:var(--orange);font-weight:600}
  .fallback{display:none}
  .no-webgl .fallback{display:block;position:fixed;left:50%;top:14%;transform:translateX(-50%);font-size:6rem;z-index:0}
  @media (max-width:520px){
    .card{padding:22px 14px 20px;border-radius:22px}
    .count{gap:6px}
  }
  @media (prefers-reduced-motion: reduce){
    .card{transition:none}
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="fallback" aria-hidden="true">☀️</div>
 
<main class="wrap">

      <div class="box"><span id="s">00</span><small>सेकंड</small></div>
    </div>
 
    <nav class="social" aria-label="सोशल मीडिया">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================== SETTINGS (yahan badlo) ================== */
const LAUNCH_DATE = new Date("2026-11-15T00:00:00+05:30"); // launch ki date
/* ============================================================ */
 
/* ---------- Countdown ---------- */
(function(){
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,"0");
  function tick(){
    let diff = Math.max(0, LAUNCH_DATE - new Date());
    const d = Math.floor(diff/86400000); diff -= d*86400000;
    const h = Math.floor(diff/3600000);  diff -= h*3600000;
    const m = Math.floor(diff/60000);    diff -= m*60000;
    const s = Math.floor(diff/1000);
    $("d").textContent = pad(d); $("h").textContent = pad(h);
    $("m").textContent = pad(m); $("s").textContent = pad(s);
  }
  tick(); setInterval(tick, 1000);
})();
 
/* ---------- 3D card tilt ---------- */
const card = document.getElementById("card");
let mx = 0, my = 0; // -1..1
function setPointer(x, y){
  mx = (x / window.innerWidth) * 2 - 1;
  my = (y / window.innerHeight) * 2 - 1;
  card.style.transform = `rotateY(${mx*8}deg) rotateX(${-my*6}deg)`;
}
window.addEventListener("pointermove", e => setPointer(e.clientX, e.clientY));
window.addEventListener("pointerleave", () => { mx = my = 0; card.style.transform = ""; });
 
/* ---------- Three.js scene ---------- */
(function(){
  const canvas = document.getElementById("scene");
  if (typeof THREE === "undefined") { document.body.classList.add("no-webgl"); return; }
 
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  } catch(e){ document.body.classList.add("no-webgl"); return; }
 
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  camera.position.set(0, 0.6, 9);
 
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
 
  /* Lights */
  scene.add(new THREE.AmbientLight(0xffe2b8, 0.7));
  const sunLight = new THREE.PointLight(0xffb347, 2.2, 40);
  scene.add(sunLight);
 
  /* Sun group (upar ki taraf, logo ki tarah) */
  const sun = new THREE.Group();
  sun.position.set(0, 2.1, 0);
  scene.add(sun);
 
  // Sun core
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(1.25, 64, 64),
    new THREE.MeshStandardMaterial({
      color:0xffc21a, emissive:0xff8a00, emissiveIntensity:0.85, roughness:0.45, metalness:0.1
    })
  );
  sun.add(core);
 
  // Glow sprite
  function glowTexture(){
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const g = c.getContext("2d");
    const grd = g.createRadialGradient(128,128,10,128,128,128);
    grd.addColorStop(0,"rgba(255,225,77,.95)");
    grd.addColorStop(0.35,"rgba(255,160,20,.55)");
    grd.addColorStop(1,"rgba(255,122,0,0)");
    g.fillStyle = grd; g.fillRect(0,0,256,256);
    return new THREE.CanvasTexture(c);
  }
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map:glowTexture(), blending:THREE.AdditiveBlending, transparent:true, depthWrite:false
  }));
  glow.scale.set(7.5, 7.5, 1);
  sun.add(glow);
 
  // Rays (12 pattiyaan, logo jaisi) - ek ring
  const rays = new THREE.Group();
  const rayMat = new THREE.MeshStandardMaterial({
    color:0xff8c00, emissive:0xff6a00, emissiveIntensity:0.6, roughness:0.5
  });
  const RAY_COUNT = 12;
  for (let i=0;i<RAY_COUNT;i++){
    const a = (i/RAY_COUNT)*Math.PI*2;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.28, 1.25, 20), rayMat);
    const r = 1.95;
    cone.position.set(Math.cos(a)*r, Math.sin(a)*r, 0);
    cone.rotation.z = a - Math.PI/2;
    rays.add(cone);
  }
  sun.add(rays);
 
  // Outer orbit rings
  const ringMat = new THREE.MeshBasicMaterial({color:0xff7a00, transparent:true, opacity:.75});
  const ring1 = new THREE.Mesh(new THREE.TorusGeometry(2.9, 0.035, 16, 160), ringMat);
  const ring2 = new THREE.Mesh(new THREE.TorusGeometry(3.4, 0.02, 16, 160), ringMat.clone());
  ring2.material.opacity = .4;
  ring1.rotation.x = 1.1; ring2.rotation.y = 1.0;
  sun.add(ring1, ring2);
 
  // Small orbiting spheres (grahon jaise)
  const orbs = [];
  for (let i=0;i<5;i++){
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.11 + Math.random()*0.08, 24, 24),
      new THREE.MeshStandardMaterial({color:i%2?0xffd24d:0xff7a00, emissive:0xff7a00, emissiveIntensity:.5})
    );
    m.userData = { r:2.6 + Math.random()*1.1, s:0.4 + Math.random()*0.6, p:Math.random()*Math.PI*2, t:Math.random()*1.2-0.6 };
    sun.add(m); orbs.push(m);
  }
 
  // Ember particles
  const N = 260;
  const pos = new Float32Array(N*3), spd = new Float32Array(N);
  for (let i=0;i<N;i++){
    pos[i*3]   = (Math.random()-.5)*22;
    pos[i*3+1] = (Math.random()-.5)*14;
    pos[i*3+2] = (Math.random()-.5)*10 - 2;
    spd[i] = 0.2 + Math.random()*0.6;
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute("position", new THREE.BufferAttribute(pos,3));
  const pts = new THREE.Points(pGeo, new THREE.PointsMaterial({
    color:0xff9a1f, size:0.09, transparent:true, opacity:.85, depthWrite:false, blending:THREE.AdditiveBlending
  }));
  scene.add(pts);
 
  /* Resize */
  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h;
    // mobile portrait: thoda peeche + sun upar
    if (w < 700){ camera.position.z = 12; sun.position.y = 2.7; sun.scale.setScalar(.85); }
    else        { camera.position.z = 9;  sun.position.y = 2.1; sun.scale.setScalar(1); }
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize); resize();
 
  /* Animate */
  const clock = new THREE.Clock();
  let tx = 0, ty = 0;
  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    const k = reduce ? 0 : 1;
 
    core.rotation.y = t*0.25*k;
    rays.rotation.z = t*0.18*k;
    ring1.rotation.z = t*0.3*k;
    ring2.rotation.x = 1.0 + t*0.2*k;
    const pulse = 1 + Math.sin(t*1.6)*0.04*k;
    core.scale.setScalar(pulse);
    glow.scale.setScalar(7.5 + Math.sin(t*1.6)*0.4*k);
    sunLight.position.copy(sun.position);
 
    orbs.forEach(o=>{
      const d = o.userData, a = t*d.s*k + d.p;
      o.position.set(Math.cos(a)*d.r, Math.sin(a)*d.r*0.55, Math.sin(a*1.3)*d.t*2);
    });
 
    const arr = pGeo.attributes.position.array;
    for (let i=0;i<N;i++){
      arr[i*3+1] += spd[i]*0.01*k;
      if (arr[i*3+1] > 7) arr[i*3+1] = -7;
    }
    pGeo.attributes.position.needsUpdate = true;
 
    // camera parallax
    tx += (mx*1.2 - tx)*0.05; ty += (-my*0.7 - ty)*0.05;
    camera.position.x = tx; camera.position.y = 0.6 + ty;
    camera.lookAt(0, 0.9, 0);
 
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
